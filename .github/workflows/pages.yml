# Build the app and deploy it to GitHub Pages. The ONNX models are not part
# of the site: the app loads them from Hugging Face (VITE_MODELS_URL), where
# scripts/models/upload_hf.py publishes them. The deploy stays small (~40 MB).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint and test
        run: |
          npx biome check .
          npm test

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_MODELS_URL: https://huggingface.co/pauldubois98/musicocr-models/resolve/main/
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
