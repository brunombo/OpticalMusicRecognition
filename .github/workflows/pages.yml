# Build the app and deploy it to GitHub Pages. The ONNX models are not in
# the repository: they are exported here (scripts/models/export_copista.py,
# which pins the copisteria commit) and cached, so the export only runs again
# when that script changes. They are served from the site's models/ folder.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore exported models
        id: models
        uses: actions/cache@v6
        with:
          path: public/models
          key: copista-onnx-${{ hashFiles('scripts/models/export_copista.py') }}

      - name: Install uv
        if: steps.models.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v10.3.3

      - name: Export models (copisteria → ONNX)
        if: steps.models.outputs.cache-hit != 'true'
        run: npm run fetch:models

      - name: Lint and test
        run: |
          npx biome check .
          npm test

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
