<!doctype html>
<!-- Debug harness: runs the recognition worker exactly like the app, on a
     test page fetched from the dev server. Open
     /debug-worker.html?image=/test_images/Rondo-MuzioClementi-0.png&size=2m
     (dev server) and watch the log; "DONE" or "PIPELINE ERROR" ends a run. -->
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>worker debug</title>
	</head>
	<body>
		<pre id="log"></pre>
		<script type="module">
			const logEl = document.getElementById("log");
			const log = (...args) => {
				console.log("[debug]", ...args);
				logEl.textContent += `${args.join(" ")}\n`;
			};
			const params = new URLSearchParams(location.search);
			const imageUrl = params.get("image") ?? "/test_images/Rondo-MuzioClementi-0.png";
			const size = params.get("size") ?? "2m";
			log("crossOriginIsolated:", globalThis.crossOriginIsolated);
			log("navigator.gpu:", !!navigator.gpu);

			const worker = new Worker(
				new URL("./src/pipeline/worker.js", import.meta.url),
				{ type: "module" },
			);
			worker.addEventListener("error", (e) =>
				log("WORKER ERROR:", e.message, e.filename, e.lineno),
			);
			worker.addEventListener("message", (e) => {
				if (e.data.type === "progress") {
					log("progress:", e.data.progress.stage, e.data.progress.ratio.toFixed(2));
				} else if (e.data.type === "result") {
					const { summary, musicXml } = e.data.result;
					log("RESULT:", JSON.stringify(summary), `${musicXml.length} chars of MusicXML`);
					log(`elapsed ${((performance.now() - started) / 1000).toFixed(1)} s`);
					log("DONE");
				} else if (e.data.type === "error") {
					log("PIPELINE ERROR:", e.data.message);
				}
			});

			const bitmap = await createImageBitmap(await (await fetch(imageUrl)).blob());
			const canvas = new OffscreenCanvas(bitmap.width, bitmap.height);
			const ctx = canvas.getContext("2d");
			ctx.drawImage(bitmap, 0, 0);
			const { data, width, height } = ctx.getImageData(0, 0, bitmap.width, bitmap.height);
			log(`image ${imageUrl}: ${width}x${height}, detector ${size}`);
			const started = performance.now();
			worker.postMessage({ id: 1, size, image: { data, width, height } });
		</script>
	</body>
</html>
